];
const key='pathfinder-final-v1';
function empty(lang='en'){return {lang,answers:[],stage:'quiz',variant:0,note:''};}
function currentItem(answers,index){return items[index<4?index:answers[3]===items[3].answer?5:4];}
function fromStorage(){
 try{const s=JSON.parse(sessionStorage.getItem(key));if(!s||!Object.hasOwn(tr,s.lang)||!Array.isArray(s.answers)||s.answers.length>5||s.answers.some(n=>!Number.isInteger(n)||n<0||n>2)||typeof s.note!=='string'||s.note.length>600||![0,1].includes(s.variant))return empty();
 if(s.answers.length<5?s.stage!=='quiz':!['plan','tutor','done'].includes(s.stage))return empty();return s;}catch{return empty();}
}
let state=fromStorage();
function persist(){try{sessionStorage.setItem(key,JSON.stringify(state));}catch{}}
const $=s=>document.getElementById(s);
function statuses(){
 return topics.map((_,i)=>{const indices=i===3?[3,4]:[i];const answered=indices.filter(n=>n<state.answers.length);if(!answered.length)return 'unknown';const hits=answered.filter(n=>state.answers[n]===currentItem(state.answers,n).answer).length;if(i===3&&answered.length===1)return hits?'partial':'gap';return hits===answered.length?'mastered':hits===0?'gap':'partial';});
}
function words(){return tr[state.lang];}
function topicText(topic,field='name'){return topic[field][['en','ru','kk'].indexOf(state.lang)];}
function priority(){const s=statuses(),rank={gap:0,partial:1,mastered:2};return [3,2,0,1].sort((a,b)=>rank[s[a]]-rank[s[b]]);}
function render(focus=false){
 const t=words(),quiz=state.stage==='quiz',tutor=state.stage==='tutor',done=state.stage==='done';
 document.documentElement.lang=state.lang;$('lang').value=state.lang;$('role').textContent=tutor?t.tutor:t.student;$('course').textContent=t.course;
 $('title').textContent=quiz?t.diag:tutor?t.tTitle:done?t.done:t.plan;$('intro').textContent=quiz?t.dIntro:tutor?t.tIntro:done?t.aIntro:t.pIntro;
 $('restart').textContent=t.restart;$('credit').textContent=t.credit;
 const s=statuses();
 $('map').innerHTML='<div class="eyebrow">'+t.signals+'</div><h2>'+t.map+'</h2><ul class="map-list">'+topics.map((topic,i)=>'<li><span>'+topicText(topic)+'</span><span class="status '+s[i]+'">'+t[s[i]]+'</span></li>').join('')+'</ul><p class="side-note">'+t.approx+'</p>';
 if(quiz)renderQuiz(t);else renderPlan(t,tutor,done);
 if(focus){(quiz?$('section-title'):$('title')).focus({preventScroll:true});}
}
function renderQuiz(t){
 const n=state.answers.length,q=currentItem(state.answers,n);
 const previous=n?currentItem(state.answers,n-1):null;
 const feedback=previous?t.feedback+' · '+(state.answers[n-1]===previous.answer?t.correct:t.incorrect)+' · '+previous.math+' → '+previous.options[previous.answer]:t.choose;
 $('panel').innerHTML='<div class="cap"><b>'+topicText(topics[q.topic])+'</b><span class="meta">'+t.question+' '+(n+1)+' '+t.of+' 5</span></div><div class="meter" aria-hidden="true"><span style="width:'+((n+1)*20)+'%"></span></div><h2 class="prompt" id="section-title" tabindex="-1">'+t[q.key]+'</h2><div class="formula">'+q.math+'</div><div class="answers">'+q.options.map((v,i)=>'<button class="answer" data-answer="'+i+'">'+v+'</button>').join('')+'</div><p class="feedback">'+feedback+'</p>';
 $('panel').querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{state.answers.push(Number(b.dataset.answer));if(state.answers.length===5)state.stage='plan';persist();render(true);});
}
function renderPlan(t,tutor,done){
 const ordered=priority(),topic=topics[ordered[0]],status=statuses()[ordered[0]],other=topicText(topics[ordered[1]]);
 const name=topicText(topic),titles=[topicText(topic,'lesson'),topicText(topic,'alt')];

 const info=state.variant?(status==='mastered'?t.practiceAlt:t.alt):(status==='mastered'?t.practice:t.lesson);
 $('panel').innerHTML='<div class="cap"><h2 id="section-title">'+t.label+'</h2><span class="meta">'+(done?t.approved:t.draft)+'</span></div><div class="week-main"><div class="eyebrow">'+t.focus+' · '+t.week+' 1</div><h3>'+titles[state.variant]+'</h3><p>'+info+'</p></div><p class="why"><b>'+t.why+'</b> '+why+' — '+name+'.</p><ul class="week-list">'+[t.review+' · '+other,t.transfer,t.retry].map((v,i)=>'<li><span class="week-index">'+t.week+' '+(i+2)+'</span>'+v+'</li>').join('')+'</ul>'+
 (tutor?'<label class="edit" for="choice">'+t.edit+'</label><select id="choice">'+titles.map((v,i)=>'<option value="'+i+'"'+(i===state.variant?' selected':'')+'>'+v+'</option>').join('')+'</select>':'')+
 (done?'<p class="why">'+(state.variant?t.editnote:'')+'</p><details class="note-box" id="reflection"><summary>'+t.reflect+'</summary><label class="edit" for="note">'+t.reflection+'</label><textarea maxlength="600" id="note"></textarea><button id="save" class="quiet">'+t.save+'</button><span id="saved" role="status"></span></details>':'<div class="actions"><button id="next" class="primary">'+(tutor?t.approve:t.tutorBtn)+'</button>'+(tutor?'<button id="back" class="quiet">'+t.back+'</button>':'')+'</div>');

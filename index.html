<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PathFinder Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=STIX+Two+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* PathFinder: navy brand band, teal action colour, status colours carry meaning (mastered / partial / gap) */
  --navy:#113148; --navy-2:#1B4161; --teal:#1B7A73; --teal-soft:#E3F1EF;
  --paper:#F3F6F9; --card:#FFFFFF; --ink:#16212E; --muted:#5A6878; --line:#DCE3EA;
  --blue:#1E5A9E; --blue-soft:#E7EFF9; --amber:#A8500C; --amber-soft:#FCEFE2;
  --font-display:'Manrope', system-ui, sans-serif; --font-body:'Inter', system-ui, sans-serif;
  --font-math:'STIX Two Text', 'Times New Roman', serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #7CC4BC;outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;color:var(--navy)}
p{margin:0}

/* top bar */
.bar{background:var(--navy);color:#fff;padding:12px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:-.01em}
.course{font-size:13px;color:#BFD0DD;border-left:1px solid #3A5677;padding-left:10px}
.grow{flex:1}
.seg{display:inline-flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:#D6E2EC;padding:6px 13px;border-radius:999px;font-size:14px;font-weight:600}
.seg button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.badge-demo{font-size:12.5px;font-weight:600;color:#FFE2C2;border:1px solid #E7A869;border-radius:999px;padding:5px 11px;white-space:nowrap}

/* tabs */
.tabs{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:4px;padding:0 16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:14px 12px 12px;font-weight:600;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:8px}
.tabs button .n{width:22px;height:22px;border-radius:50%;background:var(--paper);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted)}
.tabs button.done .n{background:var(--teal);color:#fff}
.tabs button[aria-current="page"]{color:var(--navy);border-bottom-color:var(--teal)}
.tabs button[aria-current="page"] .n{background:var(--navy);color:#fff}

main{max-width:1100px;margin:0 auto;padding:24px 20px 32px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.lead{font-size:17.5px;color:#2A3746;max-width:62ch}

.btn{border:1.5px solid transparent;border-radius:12px;padding:11px 18px;font-weight:600;font-size:15.5px;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.btn.primary{background:var(--teal);color:#fff}
.btn.primary:hover{background:#166961}
.btn.navy{background:var(--navy);color:#fff}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--navy)}
.btn.ghost:hover{border-color:var(--teal)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--teal);font-weight:600;padding:4px 0;text-decoration:underline;text-underline-offset:3px}

.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:14.5px;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);color:#0F5D57;font-weight:600}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}
@media (max-width:520px){.grid4{grid-template-columns:1fr}.bar{padding:10px 14px}main{padding:18px 14px 28px}.card{padding:18px}}

/* steps */
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--paper)}
.step .num{font-family:var(--font-display);font-weight:800;color:var(--teal);font-size:15px;min-width:26px}
.step b{display:block;color:var(--navy)}

/* question */
.qwrap{max-width:720px;width:100%;margin:0 auto}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .3s}
.level{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted)}
.dots{display:inline-flex;gap:4px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--navy)}
.qtext{font-size:21px;line-height:1.45;color:var(--ink);font-weight:500}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;min-height:58px;font-size:18px}
.opt:hover{border-color:var(--teal)}
.opt .k{width:28px;height:28px;flex:none;border-radius:8px;background:var(--paper);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted);font-family:var(--font-body)}
.opt[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.opt[aria-pressed="true"] .k{background:var(--teal);color:#fff}
.opt.good{border-color:var(--teal);background:var(--teal-soft)}
.opt.bad{border-color:var(--amber);background:var(--amber-soft)}
.adapt{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;padding:8px 12px;border-radius:10px;background:var(--blue-soft);color:var(--blue)}

/* math */
.m{font-family:var(--font-math);font-size:1.12em;white-space:nowrap}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.92em;line-height:1.15;margin:0 .15em}
.frac>span:first-child{border-bottom:1.2px solid currentColor;padding:0 .2em}
.frac>span:last-child{padding:0 .2em}
.lim{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin-right:.2em}
.lim>span:last-child{font-size:.62em;margin-top:2px}

/* status */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:13.5px;font-weight:700}
.pill.mastered{background:var(--teal-soft);color:#0F5D57}
.pill.partial{background:var(--blue-soft);color:var(--blue)}
.pill.gap{background:var(--amber-soft);color:var(--amber)}
.meter{height:10px;border-radius:99px;background:var(--paper);overflow:hidden}
.meter span{display:block;height:100%;border-radius:99px}
.topic{display:flex;flex-direction:column;gap:12px;border-top:4px solid var(--line)}
.topic.mastered{border-top-color:var(--teal)} .topic.partial{border-top-color:var(--blue)} .topic.gap{border-top-color:var(--amber)}
.tnum{font-variant-numeric:tabular-nums}

/* plan */
.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border-radius:14px;padding:14px 18px;font-weight:600}
.banner.wait{background:var(--amber-soft);color:#7A3A06;border:1px solid #F1CFA8}
.banner.ok{background:var(--teal-soft);color:#0F5D57;border:1px solid #B9DCD7}
.weeks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:980px){.weeks{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.weeks{grid-template-columns:1fr}}
.week h3{font-size:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.task{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.task.isdone{background:#F7FAF9}
.task.isdone .tt{text-decoration:line-through;color:var(--muted)}
.task .tt{font-weight:700;color:var(--navy);display:flex;gap:8px;align-items:center}
.task .kind{font-size:13.5px;color:var(--muted)}
.lo{font-size:12px;font-weight:700;color:var(--muted);background:var(--paper);border-radius:6px;padding:2px 7px;align-self:flex-start}
.why{font-size:13.5px;background:var(--paper);border-radius:10px;padding:10px;color:#2A3746}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.mastered{background:var(--teal)} .dot.partial{background:var(--blue)} .dot.gap{background:var(--amber)} .dot.tutor{background:var(--navy)}
.tag-new{font-size:11.5px;font-weight:700;color:#fff;background:var(--navy);border-radius:6px;padding:1px 6px}

/* check-in */
label.q{font-weight:700;color:var(--navy);display:block;margin-bottom:10px}
textarea{width:100%;min-height:76px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;resize:vertical}
input[type=range]{width:100%;accent-color:var(--teal)}
.changes{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.changes li{display:flex;gap:10px;align-items:flex-start;background:var(--teal-soft);border-radius:10px;padding:10px 12px;color:#0F4F49;font-weight:500}

/* teacher */
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi b{font-family:var(--font-display);font-size:30px;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.1}
.stack{display:flex;height:26px;border-radius:8px;overflow:hidden;font-size:12px;font-weight:700;color:#fff}
.stack span{display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.checkpoints{background:var(--navy);color:#fff;border-radius:14px;padding:14px 18px;font-weight:600;display:flex;gap:12px;align-items:center}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.st{font-size:13.5px;font-weight:700;border-radius:999px;padding:3px 10px;display:inline-block;white-space:nowrap}
.st.wait{background:var(--amber-soft);color:var(--amber)} .st.ok{background:var(--teal-soft);color:#0F5D57} .st.none{background:var(--paper);color:var(--muted)} .st.rej{background:#F3E8E8;color:#8A2B2B}
.check{display:flex;gap:10px;align-items:center;font-size:14.5px}
.check input{width:18px;height:18px;accent-color:var(--teal)}

/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(17,49,72,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:92%;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;box-shadow:0 8px 24px rgba(17,49,72,.25);z-index:30;max-width:calc(100% - 32px)}
.example{font-family:var(--font-math);font-size:18px;background:var(--paper);border-radius:12px;padding:12px 14px}
footer{max-width:1100px;margin:0 auto;padding:0 20px 28px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ---------- content ---------- */
var TOPICS=["functions","trig","logs","limits"];
var fr=function(a,b){return '<span class="frac"><span>'+a+'</span><span>'+b+'</span></span>'};
var lim=function(s){return '<span class="lim"><span>lim</span><span>'+s+'</span></span>'};
var DNE={en:"Does not exist",ru:"Не существует",kz:"Жоқ"};
var FIND={en:"Find {e}.",ru:"Найдите {e}.",kz:"{e} мәнін табыңыз."};
var SOLVE={en:"Solve {e}.",ru:"Решите уравнение {e}.",kz:"{e} теңдеуін шешіңіз."};

var Q={
 functions:{
  E:{t:{en:"If {e}, find f(4).",ru:"Если {e}, найдите f(4).",kz:"Егер {e} болса, f(4) мәнін табыңыз."},e:"f(x) = 2x + 3",o:["8","11","14","7"],a:1},
  M:{t:{en:"Let {e}. Find f(g(1)).",ru:"Пусть {e}. Найдите f(g(1)).",kz:"{e} болсын. f(g(1)) мәнін табыңыз."},e:"f(x) = x<sup>2</sup> − 1,&nbsp; g(x) = x + 2",o:["2","9","8","3"],a:2},
  H:{t:{en:"Find the inverse function of {e}.",ru:"Найдите обратную функцию к {e}.",kz:"{e} функциясына кері функцияны табыңыз."},e:"f(x) = "+fr("2x − 1","3"),o:[fr("3x − 1","2"),fr("3x + 1","2"),fr("3","2x − 1"),fr("2x + 1","3")],a:1}
 },
 trig:{
  E:{t:FIND,e:"sin 30°",o:[fr("√3","2"),"1",fr("1","2"),fr("√2","2")],a:2},
  M:{t:{en:"Solve {e}.",ru:"Решите: {e}.",kz:"Теңдеуді шешіңіз: {e}."},e:"sin x = "+fr("1","2")+",&nbsp; 0 ≤ x ≤ "+fr("π","2"),o:[fr("π","3"),fr("π","6"),fr("π","4"),fr("π","2")],a:1},
  H:{t:{en:"Simplify {e}.",ru:"Упростите {e}.",kz:"{e} өрнегін ықшамдаңыз."},e:fr("sin<sup>2</sup>x","1 − cos x"),o:["1 − cos x","sin x","1 + cos x","cos x"],a:2}
 },
 logs:{
  E:{t:FIND,e:"log<sub>2</sub> 8",o:["4","3","2","6"],a:1},
  M:{t:SOLVE,e:"log<sub>3</sub> x = 4",o:["12","64","7","81"],a:3},
  H:{t:SOLVE,e:"log<sub>2</sub> x + log<sub>2</sub>(x − 2) = 3",o:["−2","4",{en:"4 and −2",ru:"4 и −2",kz:"4 және −2"},"2"],a:1}
 },
 limits:{
  E:{t:FIND,e:lim("x→2")+"(3x + 1)",o:["6","5","7","∞"],a:2},
  M:{t:FIND,e:lim("x→3")+fr("x<sup>2</sup> − 9","x − 3"),o:["0","6","3",DNE],a:1},
  H:{t:FIND,e:lim("x→0")+fr("sin 3x","x"),o:["1","0","3",fr("1","3")],a:2}
 }
};

var LESSON={
 functions:{
  ex:{en:"A function gives exactly one output for each input. To find f(g(x)), work from the inside: first g(x), then put the result into f.",ru:"Функция даёт ровно одно значение для каждого x. Чтобы найти f(g(x)), идите изнутри: сначала g(x), потом подставьте результат в f.",kz:"Функция әр x үшін дәл бір мән береді. f(g(x)) табу үшін іштен бастаңыз: алдымен g(x), содан кейін нәтижені f-ке қойыңыз."},
  sample:"g(x) = x + 2,&nbsp; f(x) = x<sup>2</sup> − 1 &nbsp;⇒&nbsp; f(g(1)) = f(3) = 8",
  p:{t:{en:"Let {e}. Find f(g(5)).",ru:"Пусть {e}. Найдите f(g(5)).",kz:"{e} болсын. f(g(5)) мәнін табыңыз."},e:"f(x) = 3x,&nbsp; g(x) = x − 1",o:["15","12","14","4"],a:1},
  hint:{en:"Start inside: find g(5) first.",ru:"Начните изнутри: сначала найдите g(5).",kz:"Іштен бастаңыз: алдымен g(5) мәнін табыңыз."},
  fb:"g(5) = 4 &nbsp;⇒&nbsp; f(4) = 3 · 4 = 12"
 },
 trig:{
  ex:{en:"On the unit circle, cos is the x-coordinate and sin is the y-coordinate. Learn the key angles: 30°, 45° and 60°.",ru:"На единичной окружности cos — это координата x, а sin — координата y. Запомните ключевые углы: 30°, 45° и 60°.",kz:"Бірлік шеңберде cos — x координатасы, sin — y координатасы. Негізгі бұрыштарды есте сақтаңыз: 30°, 45° және 60°."},
  sample:"sin 30° = cos 60° = "+fr("1","2")+",&nbsp;&nbsp; sin 60° = cos 30° = "+fr("√3","2"),
  p:{t:FIND,e:"cos 60°",o:[fr("√3","2"),"0",fr("1","2"),fr("√2","2")],a:2},

  sample:"2<sup>3</sup> = 8 &nbsp;⇒&nbsp; log<sub>2</sub> 8 = 3 &nbsp;&nbsp;|&nbsp;&nbsp; log<sub>a</sub> x + log<sub>a</sub> y = log<sub>a</sub>(xy)",
  p:{t:FIND,e:"log<sub>5</sub> 25",o:["5","2","3",fr("1","2")],a:1},
  hint:{en:"5 to what power gives 25?",ru:"В какую степень нужно возвести 5, чтобы получить 25?",kz:"25 шығу үшін 5-ті қандай дәрежеге шығару керек?"},
  fb:"5<sup>2</sup> = 25 &nbsp;⇒&nbsp; log<sub>5</sub> 25 = 2"
 },
 limits:{
  ex:{en:"A limit is the value f(x) gets close to as x gets close to a. If you get 0/0, factor and cancel first.",ru:"Предел — это значение, к которому приближается f(x), когда x приближается к a. Если получилось 0/0, сначала разложите на множители и сократите.",kz:"Шек — x саны a-ға жақындағанда f(x) жақындайтын мән. 0/0 шықса, алдымен көбейткіштерге жіктеп, қысқартыңыз."},
  sample:fr("x<sup>2</sup> − 9","x − 3")+" = x + 3 &nbsp;⇒&nbsp; "+lim("x→3")+"(x + 3) = 6",
  p:{t:FIND,e:lim("x→1")+fr("x<sup>2</sup> − 1","x − 1"),o:["0","1","2",DNE],a:2},
  hint:{en:"x² − 1 = (x − 1)(x + 1).",ru:"x² − 1 = (x − 1)(x + 1).",kz:"x² − 1 = (x − 1)(x + 1)."},
  fb:fr("x<sup>2</sup> − 1","x − 1")+" = x + 1 &nbsp;⇒&nbsp; 1 + 1 = 2"
 }
};

var LO={functions:"LO1",trig:"LO2",logs:"LO3",limits:"LO4"};
var BANK=[
 {id:"b1",topic:"logs",lvl:"M",e:"log<sub>4</sub> x = 3",t:SOLVE,ans:"64"},
 {id:"b2",topic:"limits",lvl:"M",e:lim("x→2")+fr("x<sup>2</sup> − 4","x − 2"),t:FIND,ans:"4"},
 {id:"b3",topic:"trig",lvl:"E",e:"tan 45°",t:FIND,ans:"1"}
];
var GROUP={functions:[62,28,10],trig:[41,37,22],logs:[30,29,41],limits:[35,40,25]};

/* ---------- strings ---------- */
var S={

 gaps.forEach(function(x){add(1,x,"lesson","whyLessonGap");add(2,x,"practice","whyPractice");add(4,x,"review","whyReview")});
 parts.forEach(function(x){add(2,x,"lesson","whyLessonPartial");add(3,x,"practice","whyPractice")});

 return '<section><div class="eyebrow">'+t("teacher")+'</div><h1 style="font-size:28px">'+t("apprTitle")+"</h1></section>"+
 '<section class="card tbl-wrap"><table><thead><tr><th>'+t("cStudent")+"</th><th>"+t("cGaps")+"</th><th>"+t("cStatus")+"</th><th></th></tr></thead><tbody>"+
 rows.map(function(r,idx){var gaps=r.gaps.length?r.gaps.map(function(g){return '<span class="pill gap" style="margin:2px">'+tn(g)+"</span>"}).join(""):'<span class="muted small">'+(r.s==="none"?"—":t("noGaps"))+"</span>";
  var act=r.s==="wait"?'<button class="btn sm primary" data-act="approve" data-v="'+(r.demo?"demo":idx-1)+'">'+t("approve")+"</button>":"";
  var extra=r.demo&&st.plan?'<label class="check" style="margin-top:8px"><input type="checkbox" id="tutorchk" data-act="tutorToggle"'+(st.tutor?" checked":"")+">"+t("addTutor")+"</label>":"";
  return "<tr><td><b>"+r.name+"</b>"+(r.demo?' <span class="small muted">('+t("you")+")</span>":"")+extra+"</td><td>"+gaps+'</td><td><span class="st '+stCls[r.s]+'">'+stTxt[r.s]+"</span></td><td style=\"text-align:right\">"+act+"</td></tr>"}).join("")+
 "</tbody></table></section>"+'<div class="checkpoints">'+ICON.mastered+"<span>"+t("checkpoints")+"</span></div>";
}
function vBank(){
 var n=BANK.filter(function(b){return st.bank[b.id]==="wait"}).length;
 return '<section class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="eyebrow">'+t("teacher")+'</div><h1 style="font-size:28px">'+t("bankTitle")+'</h1></div><span class="st wait">'+t("pending",{n:n})+"</span></section>"+
 '<p class="muted" style="max-width:70ch">'+t("bankNote")+"</p>"+
 '<div class="grid2">'+BANK.map(function(b){var s=st.bank[b.id];
  return '<section class="card" style="display:flex;flex-direction:column;gap:12px"><div class="row" style="justify-content:space-between"><span class="eyebrow">'+tn(b.topic)+" · "+t("lv")[b.lvl]+'</span><span class="lo">'+LO[b.topic]+'</span></div><p class="qtext" style="font-size:19px">'+qtext(b)+'</p><p class="small muted">'+t("answer")+': <b class="m" style="color:var(--ink)">'+b.ans+"</b></p>"+
  (s==="wait"?'<div class="row"><button class="btn sm primary" data-act="bank" data-v="'+b.id+'|ok">'+t("approve")+'</button><button class="btn sm ghost" data-act="bank" data-v="'+b.id+'|rej">'+t("reject")+"</button></div>":'<span class="st '+(s==="ok"?"ok":"rej")+'">'+(s==="ok"?t("sOk"):t("sRej"))+"</span>")+"</section>"}).join("")+"</div>"+
 '<div class="checkpoints">'+ICON.mastered+"<span>"+t("checkpoints")+"</span></div>";
}

/* ---------- render ---------- */
function render(){
 document.documentElement.lang=st.lang==="kz"?"kk":st.lang;
 var body="";
 if(st.role==="student"){
  if(st.sTab==="diag")body=st.diag.phase==="run"?vQuestion():vIntro();
  else if(st.sTab==="map")body=vMap();else if(st.sTab==="plan")body=vPlan();else body=vCheck();
 } else {body=st.tTab==="group"?vGroup():st.tTab==="appr"?vAppr():vBank()}
 document.getElementById("app").innerHTML=header()+tabs()+"<main>"+body+"</main>"+
  '<footer><span>'+t("foot1")+"</span><span>"+t("foot2")+"</span></footer>"+vLesson()+(st.toast?'<div class="toast" role="status">'+st.toast+"</div>":"");
}
var toastTimer;
function toast(msg){st.toast=msg;clearTimeout(toastTimer);toastTimer=setTimeout(function(){st.toast=null;render()},3200)}
function findItem(id){return st.plan.filter(function(i){return i.id===id})[0]}

function act(a,v,el,ev){
 var d=st.diag;
 switch(a){
 case "role":st.role=v;try{history.replaceState(null,"",v==="teacher"?"#teacher":"#student")}catch(e){}break;
 case "lang":st.lang=v;try{localStorage.setItem("pf-lang",v)}catch(e){}break;
 case "stab":st.sTab=v;break;
 case "ttab":st.tTab=v;break;
 case "goal":st.goal=+v;break;
 case "start":st.diag={phase:"run",ti:0,lvl:"M",n:0,sel:null,answered:false,path:{}};st.sTab="diag";break;
 case "sample":
  st.res=computeResults({functions:{M:true,H:true},trig:{M:true,H:true},logs:{M:false,E:false},limits:{M:true,H:false}});
  st.plan=null;st.approved=false;st.tutor=false;st.ci={hard:[],next:[],conf:3,note:"",sent:false,changes:[]};st.diag.phase="intro";st.role="student";st.sTab="map";break;
 case "pick":
  if(d.answered)return;var i=+v,topic=TOPICS[d.ti],q=Q[topic][d.lvl],ok=i===q.a;
  d.sel=i;d.answered=true;d.path[topic]=d.path[topic]||{};d.path[topic][d.lvl]=ok;
  if(d.lvl==="M"){d.note=ok?"harder":"easier"}else{d.note="topic"}
  break;
 case "next":
  var tp=TOPICS[d.ti];
  if(d.lvl==="M"){d.lvl=d.path[tp].M?"H":"E"}else{d.ti++;d.lvl="M"}
  d.n++;d.sel=null;d.answered=false;
  if(d.n>=8){st.res=computeResults(d.path);d.phase="intro";st.plan=null;st.approved=false;st.sTab="map"}
  break;
 case "build":buildPlan();st.sTab="plan";break;
 case "why":st.openWhy[v]=!st.openWhy[v];break;
 case "toggleDone":var it=findItem(v);it.done=!it.done;break;
 case "openLesson":var li=findItem(v);st.lesson={item:v,topic:li.topic,sel:null,checked:false,hint:false,fmt:0};break;
 case "closeLesson":if(el.getAttribute("data-self")&&ev.target!==el)return;st.lesson=null;break;
 case "lpick":if(st.lesson.checked)return;st.lesson.sel=+v;break;
 case "lhint":st.lesson.hint=!st.lesson.hint;break;
 case "fmt":st.lesson.fmt=+v;break;
 case "lcheck":st.lesson.checked=true;break;
 case "lessonDone":findItem(st.lesson.item).done=true;st.lesson=null;break;
 case "askChange":toast(t("asked"));return render();
 case "ciHard":case "ciNext":var arr=a==="ciHard"?st.ci.hard:st.ci.next,k=arr.indexOf(v);if(k>-1)arr.splice(k,1);else arr.push(v);break;
 case "ciSend":sendCheckin();break;
 case "ciEdit":st.ci.sent=false;break;
 case "session":toast(t("sessionToast",{topic:tn(v)}));return render();
 case "approve":if(v==="demo"){st.approved=true;toast(t("apprToast"))}else{st.others[+v].s="ok"}break;
 case "tutorToggle":st.tutor=el.checked;if(st.plan){st.plan=st.plan.filter(function(x){return x.kind!=="tutor"});if(st.tutor){st.plan.unshift({id:"tut",w:1,topic:biggestGap()||"logs",kind:"tutor",done:false,isNew:true})}}break;
 case "bank":var p=v.split("|");st.bank[p[0]]=p[1];break;
 default:return;
 }
 render();
}
function sendCheckin(){
 var c=st.ci,ch=[],n=0;
 st.plan=st.plan.filter(function(x){return x.kind!=="extra"});
 c.hard.forEach(function(h){if(TOPICS.indexOf(h)>-1){st.plan.push({id:"x"+(n++),w:2,topic:h,kind:"extra",why:"whyExtra",done:false,isNew:true});ch.push(t("chExtra",{topic:tn(h)}))}});
 if(c.conf<=2||c.hard.indexOf("motivation")>-1)ch.push(t("chTutor"));
 if(c.next.indexOf("video")>-1)ch.push(t("chVideo"));
 if(c.next.indexOf("tutor")>-1)ch.push(t("chAsk"));
 if(c.next.indexOf("peer")>-1)ch.push(t("chPeer"));
 if(!ch.length)ch.push(t("chNone"));
 c.changes=ch;c.sent=true;
}

document.addEventListener("click",function(e){var el=e.target.closest("[data-act]");if(!el||el.tagName==="INPUT")return;act(el.getAttribute("data-act"),el.getAttribute("data-v"),el,e)});
document.addEventListener("change",function(e){var el=e.target;if(el.getAttribute&&el.getAttribute("data-act")==="tutorToggle")act("tutorToggle",null,el,e)});
document.addEventListener("input",function(e){
 if(e.target.id==="conf"){st.ci.conf=+e.target.value;var o=document.getElementById("confv");if(o)o.textContent=st.ci.conf+"/5"}
 if(e.target.id==="note"){st.ci.note=e.target.value}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&st.lesson){st.lesson=null;render()}});
render();
</script>
</body>
</html>
